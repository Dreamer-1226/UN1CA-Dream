name: OTA

# Builds a device from the "ota" branch and publishes it to the UN1CA Updates
# channel (updates/manifest.json on the same branch):
#   base        : full package. Starts the channel; users flash it once by hand.
#   incremental : diff against the device's previous OTA build, so users on that
#                 build get a small update in UN1CA Updates.
# Each build keeps its target-files zip in the release (split into <2 GiB parts),
# which is what the next incremental is diffed against.
#
# Needs the OTA_KEY_PK8 / OTA_KEY_PEM secrets (base64 of security/ssch71_ota.*)
# and the donor firmwares pinned (scripts/pin_firmware.sh), or the base would
# move under the incremental packages.

on:
  workflow_dispatch:
    inputs:
      dm1q:
        description: dm1q
        type: boolean
        default: false
      b5q:
        description: b5q
        type: boolean
        default: false
      gts7lwifi:
        description: gts7lwifi
        type: boolean
        default: false
      z3q:
        description: z3q
        type: boolean
        default: false
      x1q:
        description: x1q
        type: boolean
        default: false
      y2q:
        description: y2q
        type: boolean
        default: false
      c1q:
        description: c1q
        type: boolean
        default: false
      c2q:
        description: c2q
        type: boolean
        default: false
      mode:
        description: Package
        required: true
        type: choice
        options: [incremental, base]
      changelog:
        description: Changelog shown in UN1CA Updates (optional)
        required: false
        type: string

permissions:
  contents: write

env:
  OTA_BRANCH: ota

jobs:
  targets:
    name: Select devices
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - name: Collect the ticked devices
        id: pick
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          LIST="$(jq -c '[to_entries[] | select(.value == true or .value == "true") | .key]' <<< "$INPUTS")"
          [ "$LIST" != "[]" ] || { echo "::error::Tick at least one device"; exit 1; }
          echo "Devices: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }} (${{ inputs.mode }})
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    # One OTA build per device at a time; the devices build side by side.
    concurrency:
      group: ota-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OTA_BRANCH }}
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        env:
          OTA_KEY_PK8: ${{ secrets.OTA_KEY_PK8 }}
          OTA_KEY_PEM: ${{ secrets.OTA_KEY_PEM }}
        run: |
          [ -n "$OTA_KEY_PK8" ] && [ -n "$OTA_KEY_PEM" ] || { echo "::error::OTA_KEY_PK8 / OTA_KEY_PEM secrets are not set"; exit 1; }
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          sudo apt install -yq "linux-modules-extra-$(uname -r)" || echo "::warning::linux-modules-extra-$(uname -r) is not available"
          sudo modprobe -a erofs f2fs || echo "::warning::erofs/f2fs kernel modules are not available"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "$OTA_KEY_PK8" | base64 --decode > security/ssch71_ota.pk8
          echo -n "$OTA_KEY_PEM" | base64 --decode > /tmp/ssch71_ota.x509.pem
          # Every build ships the committed certificate in otacerts.zip; the key
          # must be its pair or devices would reject the packages.
          if [ -f security/ssch71_ota.x509.pem ] && ! cmp -s /tmp/ssch71_ota.x509.pem security/ssch71_ota.x509.pem; then
            echo "::error::OTA_KEY_PEM does not match security/ssch71_ota.x509.pem"; exit 1
          fi
          mv /tmp/ssch71_ota.x509.pem security/ssch71_ota.x509.pem

      - name: Set up JDK 21 and 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            17
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Check pinned firmware
        run: |
          if [ -z "$SOURCE_FIRMWARE_VERSION" ]; then
            echo "::error::$SOURCE_FIRMWARE is not pinned. Run scripts/pin_firmware.sh on the ota branch first."
            exit 1
          fi
          echo "Source firmware: $SOURCE_FIRMWARE_VERSION"

      - name: Find the previous OTA build
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="updates/state/${{ matrix.target }}"
          if [ "${{ inputs.mode }}" = incremental ]; then
            [ -f "$STATE" ] || { echo "::error::No previous OTA build for ${{ matrix.target }}. Run a base build first."; exit 1; }
            # shellcheck disable=SC1090
            source "$STATE"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
            echo "Previous build: $TAG ($TIMESTAMP)"
          fi

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER":"$USER" /usr/local/lib/android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Install smali tools
        run: |
          sudo apt install -yq smali
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Build ROM (target-files + full package)
        run: ./scripts/make_rom.sh --build-rom-zip

      - name: Collect outputs
        id: out
        env:
          PREV_TS: ${{ steps.prev.outputs.timestamp }}
        run: |
          TF="$(find out -maxdepth 1 -type f -name "*-target_files.zip" | head -n 1)"
          FULL="$(find out -maxdepth 1 -type f -name "*.zip" ! -name "*-target_files.zip" ! -name "*INCREMENTAL*" -newer "$TF" | head -n 1)"
          [ -f "$TF" ] && [ -f "$FULL" ] || { echo "::error::target-files or full package missing"; ls -la out; exit 1; }
          TS="$(unzip -p "$TF" build_info.txt | sed -n 's/^timestamp=//p')"
          [ -n "$TS" ] || { echo "::error::No timestamp in target-files build_info.txt"; exit 1; }
          if [ -n "$PREV_TS" ] && [ "$TS" -le "$PREV_TS" ]; then
            echo "::error::New build $TS is not newer than $PREV_TS"; exit 1
          fi
          mkdir -p out/release
          mv "$FULL" out/release/
          echo "tf=$TF" >> "$GITHUB_OUTPUT"
          echo "full=out/release/$(basename "$FULL")" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TS" >> "$GITHUB_OUTPUT"
          echo "tag=ota-${{ matrix.target }}-$TS" >> "$GITHUB_OUTPUT"
          # The incremental step only needs the two target-files zips.
          rm -rf "$ODIN_DIR" "$FW_DIR" "$WORK_DIR" "$APKTOOL_DIR"
          df -h .

      - name: Build incremental package
        if: inputs.mode == 'incremental'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/prev
          gh release download "${{ steps.prev.outputs.tag }}" -R "$GITHUB_REPOSITORY" -D out/prev -p "target_files.zip.part*"
          cat out/prev/target_files.zip.part* > out/prev/target_files.zip
          rm -f out/prev/target_files.zip.part*
          SRC_TS="$(unzip -p out/prev/target_files.zip build_info.txt | sed -n 's/^timestamp=//p')"
          [ "$SRC_TS" = "${{ steps.prev.outputs.timestamp }}" ] || { echo "::error::Previous target-files is $SRC_TS, expected ${{ steps.prev.outputs.timestamp }}"; exit 1; }
          FULL="${{ steps.out.outputs.full }}"
          OUT="out/release/$(basename "${FULL%.zip}")-INCREMENTAL_${SRC_TS}.zip"
          ./scripts/build_flashable_zip.sh -i out/prev/target_files.zip -o "$OUT" "${{ steps.out.outputs.tf }}"
          rm -rf out/prev
          SIZE="$(stat -c %s "$OUT")"
          [ "$SIZE" -lt 2147483648 ] || { echo "::error::Incremental package is larger than a release asset can be"; exit 1; }
          echo "Incremental: $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Name release files
        run: |
          # Release asset names lose some characters on upload; keep URL-safe names
          # so the manifest URLs match the uploaded files.
          for f in out/release/*.zip; do
            n="$(basename "$f" | tr -c 'A-Za-z0-9._\n-' '_')"
            [ "$(basename "$f")" = "$n" ] || mv "$f" "out/release/$n"
          done
          FULL="$(find out/release -maxdepth 1 -name "*.zip" ! -name "*INCREMENTAL*" | head -n 1)"
          echo "FULL_ZIP=$FULL" >> "$GITHUB_ENV"
          ls -la out/release

      - name: Split target-files
        run: |
          split -b 1900M -d -a 2 "${{ steps.out.outputs.tf }}" out/release/target_files.zip.part
          rm -f "${{ steps.out.outputs.tf }}"
          ls -la out/release

      - name: Upload to SourceForge
        id: sf
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_PROJECT: ${{ vars.SF_PROJECT }}
        timeout-minutes: 90
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SF_SSH_KEY" ] || [ -z "$SF_PROJECT" ]; then
            echo "::warning::SourceForge is not configured (SF_USER / SF_SSH_KEY secrets, SF_PROJECT variable)"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf && chmod 600 ~/.ssh/sf
          ssh-keyscan -t ed25519,rsa frs.sourceforge.net >> ~/.ssh/known_hosts 2> /dev/null
          DIR="/home/frs/project/$SF_PROJECT/${{ matrix.target }}"
          printf -- '-mkdir %s\n' "$DIR" | sftp -i ~/.ssh/sf -b - "$SF_USER@frs.sourceforge.net"
          FILES=("$FULL_ZIP")
          for f in out/release/*INCREMENTAL*.zip; do
            [ -f "$f" ] && FILES+=("$f")
          done
          for _ in 1 2 3; do
            rsync -e "ssh -i $HOME/.ssh/sf" --partial --progress "${FILES[@]}" "$SF_USER@frs.sourceforge.net:$DIR/" && break
            sleep 30
          done
          rm -f ~/.ssh/sf
          # downloads.sourceforge.net redirects to a mirror; UN1CA Updates follows it.
          echo "base=https://downloads.sourceforge.net/project/$SF_PROJECT/${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Upload full package to GoFile
        id: gofile
        if: steps.sf.outputs.base == ''
        continue-on-error: true
        timeout-minutes: 40
        run: |
          ZIP_FILE="$FULL_ZIP"
          for SERVER in upload upload-eu-par upload-na-phx upload-ap-sgp; do
            for _ in 1 2; do
              RESPONSE=$(curl -sS --connect-timeout 30 --max-time 1500 --retry 2 --retry-delay 10 \
                -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER }}" \
                "https://$SERVER.gofile.io/uploadFile" || true)
              LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
              if [ -n "$LINK" ]; then
                echo "link=$LINK" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ inputs.changelog }}
          SF_BASE: ${{ steps.sf.outputs.base }}
        run: |
          TAG="${{ steps.out.outputs.tag }}"
          FULL="$FULL_ZIP"
          FILES=(out/release/target_files.zip.part*)
          {
            echo "${{ matrix.target }} OTA build ${{ steps.out.outputs.timestamp }} (${{ inputs.mode }})"
            echo
            echo "Source firmware: $SOURCE_FIRMWARE_VERSION"
            if [ -n "$SF_BASE" ]; then
              echo "Full package: $SF_BASE/$(basename "$FULL")"
            elif [ -n "${{ steps.gofile.outputs.link }}" ]; then
              echo "Full package: ${{ steps.gofile.outputs.link }}"
            fi
            [ -n "${{ steps.prev.outputs.tag }}" ] && echo "Incremental from: ${{ steps.prev.outputs.tag }}"
            [ -n "$CHANGELOG" ] && { echo; echo "$CHANGELOG"; }
          } > out/notes.md
          # Full packages over 2 GiB only go to SourceForge (or GoFile); smaller
          # ones go in the release too, as a second download URL.
          if [ "$(stat -c %s "$FULL")" -lt 2147483648 ]; then
            FILES+=("$FULL")
          fi
          for f in out/release/*INCREMENTAL*.zip; do
            [ -f "$f" ] && FILES+=("$f")
          done
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            --title "$TAG" --notes-file out/notes.md "${FILES[@]}"

      - name: Update manifest
        env:
          CHANGELOG: ${{ inputs.changelog }}
          SF_BASE: ${{ steps.sf.outputs.base }}
        run: |
          TAG="${{ steps.out.outputs.tag }}"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          FULL="$FULL_ZIP"
          # UN1CA Updates tries the URLs of an entry in order.
          urls()
          {
            local f="$1" big="$2"
            [ "$big" = 1 ] || echo "$BASE_URL/$(basename "$f")"
            [ -z "$SF_BASE" ] || echo "$SF_BASE/$(basename "$f")"
          }
          publish()
          {
            BIG=0
            [ "$(stat -c %s "$FULL")" -lt 2147483648 ] || BIG=1
            mapfile -t U < <(urls "$FULL" "$BIG")
            if [ "${#U[@]}" -gt 0 ]; then
              python3 scripts/ota/manifest.py add updates/manifest.json "$FULL" "${U[@]}" || return 1
            else
              echo "::warning::Full package is over 2 GiB and SourceForge is not configured, so it is not in the manifest"
            fi
            for f in out/release/*INCREMENTAL*.zip; do
              [ -f "$f" ] || continue
              mapfile -t U < <(urls "$f" 0)
              python3 scripts/ota/manifest.py add updates/manifest.json "$f" "${U[@]}" || return 1
            done
            [ -f updates/manifest.json ] || echo '{"response": []}' > updates/manifest.json
            python3 scripts/ota/manifest.py check updates/manifest.json || return 1
            VERSION="$(unzip -p "$FULL" build_info.txt | sed -n 's/^version=//p')"
            if [ -n "$CHANGELOG" ]; then
              printf '%s\n' "$CHANGELOG" > "updates/$VERSION.txt"
            fi
            mkdir -p updates/state
            printf 'TAG=%s\nTIMESTAMP=%s\n' "$TAG" "${{ steps.out.outputs.timestamp }}" > "updates/state/${{ matrix.target }}"
            git add updates
            git commit -m "ota: ${{ matrix.target }}: Publish ${{ steps.out.outputs.timestamp }} (${{ inputs.mode }})"
          }
          # Devices built side by side all edit manifest.json: on a rejected push,
          # start again from the branch as the other device left it.
          for _ in 1 2 3 4 5; do
            git fetch origin "$OTA_BRANCH"
            git reset -q --hard "origin/$OTA_BRANCH"
            publish || exit 1
            git push origin "HEAD:$OTA_BRANCH" && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
