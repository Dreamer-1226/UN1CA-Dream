name: OTA

# Builds devices and publishes them to the UN1CA Updates channel
# (updates/manifest.json on the "ota" branch, which only holds channel data):
#   base        : full package. Starts a device's channel; flash it once by hand.
#   incremental : diff against the device's previous OTA build, so phones on that
#                 build get a small update in UN1CA Updates.
#   auto        : incremental when the device has a previous OTA build, else base.
# Each build keeps its target-files zip in its release (split into <2 GiB parts)
# until the next build has been diffed against it.
#
# The CI workflows call this for the OTA devices on every push, so every build
# of those devices is an OTA build and phones never leave the chain. It can also
# be run by hand, for several devices at once.
#
# Needs the OTA_KEY_PK8 secret (base64 of security/ssch71_ota.pk8)
# and the donor firmwares pinned (scripts/pin_firmware.sh), or Samsung updates
# would turn every incremental into a full image.

on:
  workflow_call:
    inputs:
      targets:
        description: JSON list of devices
        required: true
        type: string
      mode:
        required: false
        type: string
        default: auto
      changelog:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      dm1q:
        description: dm1q
        type: boolean
        default: false
      b5q:
        description: b5q
        type: boolean
        default: false
      gts7lwifi:
        description: gts7lwifi
        type: boolean
        default: false
      z3q:
        description: z3q
        type: boolean
        default: false
      x1q:
        description: x1q
        type: boolean
        default: false
      y2q:
        description: y2q
        type: boolean
        default: false
      c1q:
        description: c1q
        type: boolean
        default: false
      c2q:
        description: c2q
        type: boolean
        default: false
      mode:
        description: Package
        required: true
        type: choice
        options: [auto, incremental, base]
      changelog:
        description: Changelog shown in UN1CA Updates (empty = commit titles since the previous build)
        required: false
        type: string

permissions:
  contents: write

env:
  OTA_BRANCH: ota

jobs:
  targets:
    name: Select devices
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - name: Collect the devices
        id: pick
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          LIST="$(jq -c 'if (.targets // "") != "" then (.targets | fromjson)
                         else [to_entries[] | select(.value == true or .value == "true") | .key] end' <<< "$INPUTS")"
          [ "$LIST" != "[]" ] || { echo "::error::Tick at least one device"; exit 1; }
          echo "Devices: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    # One OTA build per device at a time; the devices build side by side.
    concurrency:
      group: ota-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        env:
          OTA_KEY_PK8: ${{ secrets.OTA_KEY_PK8 }}
          OTA_KEY_PEM: ${{ secrets.OTA_KEY_PEM }}
        run: |
          [ -n "$OTA_KEY_PK8" ] || { echo "::error::The OTA_KEY_PK8 secret is not set"; exit 1; }
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          # The disk clean-up removes the GitHub CLI; the release and incremental
          # steps need it.
          command -v gh > /dev/null || sudo apt install -yq gh
          sudo apt install -yq "linux-modules-extra-$(uname -r)" || echo "::warning::linux-modules-extra-$(uname -r) is not available"
          sudo modprobe -a erofs f2fs || echo "::warning::erofs/f2fs kernel modules are not available"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "$OTA_KEY_PK8" | base64 --decode > security/ssch71_ota.pk8
          # The certificate is public and committed; OTA_KEY_PEM is only needed
          # when it is not.
          if [ ! -f security/ssch71_ota.x509.pem ]; then
            [ -n "$OTA_KEY_PEM" ] || { echo "::error::security/ssch71_ota.x509.pem is not committed and OTA_KEY_PEM is not set"; exit 1; }
            echo -n "$OTA_KEY_PEM" | base64 --decode > security/ssch71_ota.x509.pem
          fi
          # Every build ships this certificate in otacerts.zip; the key must be
          # its pair or devices would reject the packages.
          KEY_PUB="$(openssl pkey -inform DER -in security/ssch71_ota.pk8 -pubout 2> /dev/null \
            || openssl pkey -in security/ssch71_ota.pk8 -pubout)"
          CERT_PUB="$(openssl x509 -in security/ssch71_ota.x509.pem -noout -pubkey)"
          if [ -z "$KEY_PUB" ] || [ "$KEY_PUB" != "$CERT_PUB" ]; then
            echo "::error::OTA_KEY_PK8 is not the key of security/ssch71_ota.x509.pem"; exit 1
          fi

      - name: Set up JDK 21 and 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            21
            17
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Check pinned firmware
        run: |
          if [ -z "$SOURCE_FIRMWARE_VERSION" ]; then
            echo "::error::$SOURCE_FIRMWARE is not pinned. Run scripts/pin_firmware.sh first."
            exit 1
          fi
          echo "Source firmware: $SOURCE_FIRMWARE_VERSION"

      - name: Find the previous OTA build
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          git fetch -q --depth=1 origin "+refs/heads/$OTA_BRANCH:refs/remotes/origin/$OTA_BRANCH" || true
          STATE="$(git show "origin/$OTA_BRANCH:updates/state/${{ matrix.target }}" 2> /dev/null || true)"
          [ -n "$MODE" ] || MODE=auto
          if [ "$MODE" = auto ]; then
            if [ -n "$STATE" ]; then MODE=incremental; else MODE=base; fi
          fi
          if [ "$MODE" = incremental ]; then
            [ -n "$STATE" ] || { echo "::error::No previous OTA build for ${{ matrix.target }}. Run a base build first."; exit 1; }
            TAG="$(sed -n 's/^TAG=//p' <<< "$STATE")"
            TIMESTAMP="$(sed -n 's/^TIMESTAMP=//p' <<< "$STATE")"
            COMMIT="$(sed -n 's/^COMMIT=//p' <<< "$STATE")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
            echo "Previous build: $TAG ($TIMESTAMP, ${COMMIT:-unknown commit})"
            # Default changelog: the commit titles since the previous build.
            if [ -z "$CHANGELOG" ] && [ -n "$COMMIT" ]; then
              CHANGELOG="$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...$GITHUB_SHA" \
                --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' 2> /dev/null | grep -v '^- Merge ' | tail -n 50 || true)"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            printf '%s\n' "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER":"$USER" /usr/local/lib/android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Install smali tools
        run: |
          sudo apt install -yq smali
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Build ROM (target-files + full package)
        run: ./scripts/make_rom.sh --build-rom-zip

      - name: Collect outputs
        id: out
        env:
          PREV_TS: ${{ steps.prev.outputs.timestamp }}
        run: |
          TF="$(find out -maxdepth 1 -type f -name "*-target_files.zip" | head -n 1)"
          FULL="$(find out -maxdepth 1 -type f -name "*.zip" ! -name "*-target_files.zip" ! -name "*INCREMENTAL*" -newer "$TF" | head -n 1)"
          [ -f "$TF" ] && [ -f "$FULL" ] || { echo "::error::target-files or full package missing"; ls -la out; exit 1; }
          TS="$(unzip -p "$TF" build_info.txt | sed -n 's/^timestamp=//p')"
          [ -n "$TS" ] || { echo "::error::No timestamp in target-files build_info.txt"; exit 1; }
          if [ -n "$PREV_TS" ] && [ "$TS" -le "$PREV_TS" ]; then
            echo "::error::New build $TS is not newer than $PREV_TS"; exit 1
          fi
          mkdir -p out/release
          mv "$FULL" out/release/
          echo "tf=$TF" >> "$GITHUB_OUTPUT"
          echo "full=out/release/$(basename "$FULL")" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TS" >> "$GITHUB_OUTPUT"
          echo "tag=ota-${{ matrix.target }}-$TS" >> "$GITHUB_OUTPUT"
          # The incremental step only needs the two target-files zips.
          rm -rf "$ODIN_DIR" "$FW_DIR" "$WORK_DIR" "$APKTOOL_DIR"
          df -h .

      - name: Build incremental package
        if: steps.prev.outputs.mode == 'incremental'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/prev
          gh release download "${{ steps.prev.outputs.tag }}" -R "$GITHUB_REPOSITORY" -D out/prev -p "target_files.zip.part*"
          cat out/prev/target_files.zip.part* > out/prev/target_files.zip
          rm -f out/prev/target_files.zip.part*
          SRC_TS="$(unzip -p out/prev/target_files.zip build_info.txt | sed -n 's/^timestamp=//p')"
          [ "$SRC_TS" = "${{ steps.prev.outputs.timestamp }}" ] || { echo "::error::Previous target-files is $SRC_TS, expected ${{ steps.prev.outputs.timestamp }}"; exit 1; }
          FULL="${{ steps.out.outputs.full }}"
          OUT="out/release/$(basename "${FULL%.zip}")-INCREMENTAL_${SRC_TS}.zip"
          ./scripts/build_flashable_zip.sh -i out/prev/target_files.zip -o "$OUT" "${{ steps.out.outputs.tf }}"
          rm -rf out/prev
          SIZE="$(stat -c %s "$OUT")"
          [ "$SIZE" -lt 2147483648 ] || { echo "::error::Incremental package is larger than a release asset can be"; exit 1; }
          echo "Incremental: $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Name release files
        run: |
          # Release asset names lose some characters on upload; keep URL-safe names
          # so the manifest URLs match the uploaded files.
          for f in out/release/*.zip; do
            n="$(basename "$f" | tr -c 'A-Za-z0-9._\n-' '_')"
            [ "$(basename "$f")" = "$n" ] || mv "$f" "out/release/$n"
          done
          FULL="$(find out/release -maxdepth 1 -name "*.zip" ! -name "*INCREMENTAL*" | head -n 1)"
          echo "FULL_ZIP=$FULL" >> "$GITHUB_ENV"
          ls -la out/release

      - name: Split target-files
        run: |
          split -b 1900M -d -a 2 "${{ steps.out.outputs.tf }}" out/release/target_files.zip.part
          rm -f "${{ steps.out.outputs.tf }}"
          ls -la out/release

      - name: Upload to Hugging Face
        id: hf
        # A failed upload falls back to GoFile instead of throwing the build away.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO }}
          HF_REPO_TYPE: ${{ vars.HF_REPO_TYPE }}
        timeout-minutes: 90
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_REPO" ]; then
            echo "::warning::Hugging Face is not configured (HF_TOKEN secret, HF_REPO variable)"
            exit 0
          fi
          FILES=("$FULL_ZIP")
          for f in out/release/*INCREMENTAL*.zip; do
            [ -f "$f" ] && FILES+=("$f")
          done
          pip install -q --break-system-packages -U huggingface_hub hf_xet 2> /dev/null \
            || pip install -q -U huggingface_hub hf_xet
          TYPE_FILE="$RUNNER_TEMP/hf_repo_type"
          python3 - "$HF_REPO" "$HF_REPO_TYPE" "$TYPE_FILE" "${{ matrix.target }}" "${FILES[@]}" <<'EOF'
          import os, sys, time
          from huggingface_hub import HfApi
          repo, kind, type_file, target, *files = sys.argv[1:]
          api = HfApi(token=os.environ["HF_TOKEN"])
          # HF_REPO_TYPE is optional: find out whether the repo is a model,
          # dataset or space repo.
          for k in ([kind] if kind else ["model", "dataset", "space"]):
              try:
                  api.repo_info(repo, repo_type=k)
                  kind = k
                  break
              except Exception:
                  pass
          else:
              sys.exit(f"Hugging Face repo {repo} not found (or the token cannot see it)")
          print(f"Hugging Face {kind} repo: {repo}")
          with open(type_file, "w") as fp:
              fp.write(kind)
          for f in files:
              name = os.path.basename(f)
              for attempt in range(3):
                  try:
                      api.upload_file(path_or_fileobj=f, path_in_repo=f"{target}/{name}",
                                      repo_id=repo, repo_type=kind,
                                      commit_message=f"{target}: {name}")
                      print(f"Uploaded {target}/{name}")
                      break
                  except Exception as e:
                      print(f"Upload of {name} failed: {e}")
                      if attempt == 2:
                          raise
                      time.sleep(30)
          EOF
          # resolve/main/<file> answers with the file itself (via a CDN redirect),
          # no sign-in needed as long as the repo is public.
          TYPE="$(cat "$TYPE_FILE")"
          case "$TYPE" in
            dataset) PREFIX="datasets/" ;;
            space) PREFIX="spaces/" ;;
            *) PREFIX="" ;;
          esac
          echo "base=https://huggingface.co/$PREFIX$HF_REPO/resolve/main/${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Upload to SourceForge
        id: sf
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_PROJECT: ${{ vars.SF_PROJECT }}
        timeout-minutes: 90
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SF_SSH_KEY" ] || [ -z "$SF_PROJECT" ]; then
            echo "::warning::SourceForge is not configured (SF_USER / SF_SSH_KEY secrets, SF_PROJECT variable)"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf && chmod 600 ~/.ssh/sf
          ssh-keyscan -t ed25519,rsa frs.sourceforge.net >> ~/.ssh/known_hosts 2> /dev/null
          DIR="/home/frs/project/$SF_PROJECT/${{ matrix.target }}"
          printf -- '-mkdir %s\n' "$DIR" | sftp -i ~/.ssh/sf -b - "$SF_USER@frs.sourceforge.net"
          FILES=("$FULL_ZIP")
          for f in out/release/*INCREMENTAL*.zip; do
            [ -f "$f" ] && FILES+=("$f")
          done
          for _ in 1 2 3; do
            rsync -e "ssh -i $HOME/.ssh/sf" --partial --progress "${FILES[@]}" "$SF_USER@frs.sourceforge.net:$DIR/" && break
            sleep 30
          done
          rm -f ~/.ssh/sf
          # downloads.sourceforge.net redirects to a mirror; UN1CA Updates follows it.
          echo "base=https://downloads.sourceforge.net/project/$SF_PROJECT/${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Upload full package to GoFile
        id: gofile
        if: steps.sf.outputs.base == '' && steps.hf.outputs.base == ''
        continue-on-error: true
        timeout-minutes: 40
        run: |
          ZIP_FILE="$FULL_ZIP"
          for SERVER in upload upload-eu-par upload-na-phx upload-ap-sgp; do
            for _ in 1 2; do
              RESPONSE=$(curl -sS --connect-timeout 30 --max-time 1500 --retry 2 --retry-delay 10 \
                -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER }}" \
                "https://$SERVER.gofile.io/uploadFile" || true)
              LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
              if [ -n "$LINK" ]; then
                echo "link=$LINK" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.prev.outputs.changelog }}
          SF_BASE: ${{ steps.sf.outputs.base }}
          HF_BASE: ${{ steps.hf.outputs.base }}
          GOFILE: ${{ steps.gofile.outputs.link }}
        run: |
          TAG="${{ steps.out.outputs.tag }}"
          FULL="$FULL_ZIP"
          FILES=(out/release/target_files.zip.part*)
          if [ -n "$HF_BASE" ]; then
            LINK="$HF_BASE/$(basename "$FULL")"
          elif [ -n "$SF_BASE" ]; then
            LINK="$SF_BASE/$(basename "$FULL")"
          else
            LINK="$GOFILE"
          fi
          {
            echo "${{ matrix.target }} OTA build ${{ steps.out.outputs.timestamp }} (${{ steps.prev.outputs.mode }})"
            echo
            echo "Source firmware: $SOURCE_FIRMWARE_VERSION"
            [ -n "$LINK" ] && echo "Full package: $LINK"
            [ -n "${{ steps.prev.outputs.tag }}" ] && echo "Incremental from: ${{ steps.prev.outputs.tag }}"
            [ -n "$CHANGELOG" ] && { echo; echo "$CHANGELOG"; }
          } > out/notes.md
          echo "### ${{ matrix.target }} (${{ steps.prev.outputs.mode }}): ${LINK:-no full package link}" >> "$GITHUB_STEP_SUMMARY"
          # Full packages over 2 GiB only go to Hugging Face / SourceForge (or GoFile); smaller
          # ones go in the release too, as a second download URL.
          if [ "$(stat -c %s "$FULL")" -lt 2147483648 ]; then
            FILES+=("$FULL")
          fi
          for f in out/release/*INCREMENTAL*.zip; do
            [ -f "$f" ] && FILES+=("$f")
          done
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file out/notes.md "${FILES[@]}"

      - name: Update manifest
        env:
          CHANGELOG: ${{ steps.prev.outputs.changelog }}
          SF_BASE: ${{ steps.sf.outputs.base }}
          HF_BASE: ${{ steps.hf.outputs.base }}
        run: |
          TAG="${{ steps.out.outputs.tag }}"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          FULL="$PWD/$FULL_ZIP"
          MANIFEST_PY="$PWD/scripts/ota/manifest.py"
          RELEASE_DIR="$PWD/out/release"
          OTA="$RUNNER_TEMP/ota"
          # UN1CA Updates downloads every URL of an entry and joins them: they are
          # the parts of one file, not mirrors. List a single URL per package.
          urls()
          {
            local f="$1" big="$2" n
            n="$(basename "$f")"
            if [ "$big" != 1 ]; then
              echo "$BASE_URL/$n"
            elif [ -n "$HF_BASE" ]; then
              echo "$HF_BASE/$n"
            elif [ -n "$SF_BASE" ]; then
              echo "$SF_BASE/$n"
            fi
          }
          publish()
          {
            BIG=0
            [ "$(stat -c %s "$FULL")" -lt 2147483648 ] || BIG=1
            mapfile -t U < <(urls "$FULL" "$BIG")
            if [ "${#U[@]}" -gt 0 ]; then
              python3 "$MANIFEST_PY" add updates/manifest.json "$FULL" "${U[@]}" || return 1
            else
              echo "::warning::Full package is over 2 GiB and neither Hugging Face nor SourceForge is configured, so it is not in the manifest"
            fi
            for f in "$RELEASE_DIR"/*INCREMENTAL*.zip; do
              [ -f "$f" ] || continue
              mapfile -t U < <(urls "$f" 0)
              python3 "$MANIFEST_PY" add updates/manifest.json "$f" "${U[@]}" || return 1
            done
            mkdir -p updates/state
            [ -f updates/manifest.json ] || echo '{"response": []}' > updates/manifest.json
            python3 "$MANIFEST_PY" check updates/manifest.json || return 1
            VERSION="$(unzip -p "$FULL" build_info.txt | sed -n 's/^version=//p')"
            if [ -n "$CHANGELOG" ]; then
              printf '%s\n' "$CHANGELOG" > "updates/$VERSION.txt"
            fi
            printf 'TAG=%s\nTIMESTAMP=%s\nCOMMIT=%s\n' "$TAG" "${{ steps.out.outputs.timestamp }}" "$GITHUB_SHA" \
              > "updates/state/${{ matrix.target }}"
            git add updates
            git commit -q -m "ota: ${{ matrix.target }}: Publish ${{ steps.out.outputs.timestamp }} (${{ steps.prev.outputs.mode }})"
          }
          # The ota branch only holds channel data. Devices built side by side all
          # edit manifest.json: on a rejected push, start again from the branch as
          # the other device left it.
          for _ in 1 2 3 4 5; do
            git fetch -q --depth=1 origin "+refs/heads/$OTA_BRANCH:refs/remotes/origin/$OTA_BRANCH"
            rm -rf "$OTA"; git worktree prune
            git worktree add -q --detach "$OTA" "origin/$OTA_BRANCH"
            (cd "$OTA" && publish) || exit 1
            git -C "$OTA" push origin "HEAD:$OTA_BRANCH" && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1

      - name: Drop the previous target-files
        if: steps.prev.outputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the newest build is diffed against; keep the old packages.
          PREV="${{ steps.prev.outputs.tag }}"
          for a in $(gh release view "$PREV" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^target_files\.zip\.part'); do
            gh release delete-asset "$PREV" "$a" -R "$GITHUB_REPOSITORY" -y
          done
